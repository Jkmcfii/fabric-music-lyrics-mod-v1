name: Build Fabric mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft mod jar
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Gradle project files exist
        shell: bash
        run: |
          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "Missing build.gradle / build.gradle.kts. Add the Fabric mod project files before running this workflow."
            exit 1
          fi
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "Missing settings.gradle / settings.gradle.kts. Add the Gradle settings file before running this workflow."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build the mod
        shell: bash
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon build
          else
            gradle --no-daemon build
          fi

      - name: Upload built jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-fabric-mod
          path: |
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
