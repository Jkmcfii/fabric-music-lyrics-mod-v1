name: Build Fabric mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft mod jar
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Gradle project exists
        run: |
          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ] && [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "This repository does not contain a Gradle/Fabric mod project yet. Add build.gradle, settings.gradle, gradle.properties, and the mod source files before building a jar."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon build
          else
            gradle --no-daemon build
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-fabric-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
